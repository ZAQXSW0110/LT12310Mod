name: Build Dylib
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LT12310Mod_Dylib
          path: .theos/obj/LT12310Mod.dylib
