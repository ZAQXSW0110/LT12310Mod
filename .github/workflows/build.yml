name: Build Dylib
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Download and setup iOS SDK (固定有效地址)
        run: |
          cd ~/theos/sdks
          curl -L "https://github.com/theos/sdks/raw/master/iPhoneOS15.0.sdk.tar.xz" -o iPhoneOS15.0.sdk.tar.xz
          tar -xf iPhoneOS15.0.sdk.tar.xz
          ls -la iPhoneOS15.0.sdk/

      - name: Build Tweak
        run: |
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LT12310Mod_Dylib
          path: .theos/obj/LT12310Mod.dylib
