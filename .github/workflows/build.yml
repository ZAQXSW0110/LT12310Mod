name: Build Dylib
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Install SDK
        run: |
          cd ~/theos
          git clone https://github.com/theos/sdks.git sdks

      - name: Build
        run: |
          make clean
          make

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: .theos/obj/*.dylib
